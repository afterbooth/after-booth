spring.main.web-application-type=none
spring.main.banner-mode=off

# Spring AI 2.0.1 hands base-url to the official openai-java SDK, which appends "chat/completions" to it
# (its own default is https://api.openai.com/v1). So the base URL must end in /v1; META_BASE_URL in .env does not.
spring.ai.openai.base-url=${META_BASE_URL}/v1
spring.ai.openai.api-key=${META_API_KEY}
spring.ai.openai.chat.options.model=${META_SPARK_MODEL}
# Raw failures are what the spike measures, and retries would spend credits
spring.ai.openai.max-retries=0
spring.ai.retry.max-attempts=1
spring.ai.openai.timeout=120s

spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

spike.image=../samples/rack-gondola-single.jpg
spike.calls-log=../out/calls.jsonl
