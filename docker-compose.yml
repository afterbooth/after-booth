# Local development. Phase 2 (#11) adds backend and frontend services so one `docker compose up` runs the demo.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: afterbooth
      POSTGRES_USER: afterbooth
      POSTGRES_PASSWORD: local-only
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afterbooth -d afterbooth"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
