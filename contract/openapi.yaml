openapi: 3.1.0
info:
  title: AfterBooth API
  version: 0.0.1
  description: |
    API contract of record. The frontend generates its client and MSW mocks from this file (frontend `npm run gen:api`).
    This is a minimal version that proves the generation pipeline. Issue #1 adds inventory, intake drafts,
    pickup requests, allocation (HOLD / confirm / cancel), handover and stats.
    Contract changes go in a separate commit that touches only contract/, recorded in docs/DECISIONS.md.
servers:
  - url: /
paths:
  /api/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Server status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    Health:
      type: object
      required: [status, aiMode]
      properties:
        status:
          type: string
          enum: [UP]
        aiMode:
          type: string
          enum: [live, record, replay]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable reason code (e.g. VEHICLE_TOO_SMALL, QTY_UNAVAILABLE)
        message:
          type: string
          description: Korean message shown to the user
