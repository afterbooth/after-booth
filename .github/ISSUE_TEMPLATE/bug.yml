name: Bug
description: Something behaves differently from docs/SPEC.md or the contract
title: "<what breaks, for whom>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Title = the symptom: "Second browser gets 500 instead of an alternative", not "Fix allocation".
  - type: textarea
    id: summary
    attributes:
      label: In one sentence
      description: What breaks, for whom, and how bad it is for the demo.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      value: |
        Expected:
        Actual:
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include AI_MODE (live / record / replay) and the request or screen.
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: The SPEC line, contract operation or decision that defines the expected behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
