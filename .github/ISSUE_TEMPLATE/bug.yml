name: Bug
description: Something does not work as docs/SPEC.md or the contract says
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include AI_MODE (live / record / replay) and the request or screen.
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
