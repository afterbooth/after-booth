name: Feature
description: Something a user can do when this is done, usually a backend + frontend slice
title: "<what the user can do>"
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Title = the outcome, not the work: "Receiver holds an alternative item", not "Add holdItem endpoint".
        The title and "In one sentence" must say the same thing.
  - type: textarea
    id: summary
    attributes:
      label: In one sentence
      description: Who can do what when this is done. A reader who stops here should know the goal.
      placeholder: A giver photographs a booth and gets an editable inventory draft within seconds.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem or the SPEC section this delivers. One to three lines.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: In and out, one line each.
      value: |
        In:
        Out:
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Each line is checkable and names how it is proven (a test, a command, a screen).
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: SPEC section, contract operations, ERD tables and decisions this relies on.
      placeholder: "SPEC §Features 1 · contract createIntakeDraft, confirmIntakeDraft · ERD intake_draft, item · D-018"
    validations:
      required: true
  - type: dropdown
    id: meta
    attributes:
      label: Meta models involved
      multiple: true
      options:
        - None
        - Muse Spark
        - SAM 3.1
        - Muse Voice Transcribe
  - type: input
    id: depends
    attributes:
      label: Depends on
      placeholder: "#1, #3 (or None)"
