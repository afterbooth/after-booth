spring.application.name=afterbooth

# The local DB comes from the root docker-compose.yml
spring.docker.compose.file=../docker-compose.yml
spring.docker.compose.lifecycle-management=start-only

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jackson.default-property-inclusion=non_null

# AI call mode: live | record | replay. Defaults to replay, which spends no credits
afterbooth.ai.mode=${AI_MODE:replay}
afterbooth.ai.fixtures-dir=${AI_FIXTURES_DIR:../fixtures}

# Meta Model API (OpenAI compatible). Base URL and model IDs come from docs/DECISIONS.md D-010 and spike/REPORT.md. Never guess
spring.ai.openai.api-key=${META_API_KEY:replay-mode-no-key}
spring.ai.openai.base-url=${META_BASE_URL:https://example.invalid}
spring.ai.openai.chat.options.model=${META_SPARK_MODEL:unset}
afterbooth.ai.models.spark=${META_SPARK_MODEL:unset}
afterbooth.ai.models.sam=${META_SAM_MODEL:unset}
afterbooth.ai.models.transcribe=${META_TRANSCRIBE_MODEL:unset}

management.endpoints.web.exposure.include=health,info
