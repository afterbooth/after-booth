spring.application.name=afterbooth

# The local DB comes from the root docker-compose.yml
spring.docker.compose.file=../docker-compose.yml
spring.docker.compose.lifecycle-management=start-only

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jackson.default-property-inclusion=non_null
# Keep the +09:00 offset (D-019) when stored responses are read back
spring.jackson.datatype.datetime.adjust-dates-to-context-time-zone=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# A 60-second mono 16 kHz PCM WAV needs 1,920,044 bytes before multipart framing.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# AI call mode: live | record | replay. Defaults to replay, which spends no credits (AGENTS.md hard rule 4)
afterbooth.ai.mode=${AI_MODE:replay}
afterbooth.ai.fixtures-dir=${AI_FIXTURES_DIR:../fixtures}

# Meta Model API. Base URL, paths and model IDs confirmed in docs/DECISIONS.md D-010, D-027 and spike/REPORT.md section 2. Never guess
# The base URL has no /v1; the endpoint paths carry it
afterbooth.ai.base-url=${META_BASE_URL:https://api.meta.ai}
afterbooth.ai.api-key=${META_API_KEY:}
afterbooth.ai.models.spark=${META_SPARK_MODEL:muse-spark-1.3}
afterbooth.ai.models.sam=${META_SAM_MODEL:sam-3.1}
afterbooth.ai.models.transcribe=${META_TRANSCRIBE_MODEL:muse-voice-transcribe-1.0}
afterbooth.ai.paths.spark=/v1/chat/completions
afterbooth.ai.paths.sam=/v1/responses
afterbooth.ai.paths.transcribe=/v1/asr/transcribe
# From the latencies measured in spike/REPORT.md section 5
afterbooth.ai.timeouts.spark=30s
afterbooth.ai.timeouts.sam=10s
afterbooth.ai.timeouts.transcribe=15s
afterbooth.ai.transcribe-language-bias=Korean
afterbooth.ai.intake.reasoning-effort=${AI_INTAKE_REASONING_EFFORT:minimal}
afterbooth.ai.intake.confidence-threshold=${AI_INTAKE_CONFIDENCE_THRESHOLD:0.8}
afterbooth.ai.sam.min-score=${AI_SAM_MIN_SCORE:0.5}

management.endpoints.web.exposure.include=health,info

# Application/demo cargo envelopes in centimeters, not manufacturer measurements.
afterbooth.vehicle-cargo.sedan.width-cm=120
afterbooth.vehicle-cargo.sedan.depth-cm=80
afterbooth.vehicle-cargo.sedan.height-cm=60
afterbooth.vehicle-cargo.suv.width-cm=160
afterbooth.vehicle-cargo.suv.depth-cm=100
afterbooth.vehicle-cargo.suv.height-cm=100
afterbooth.vehicle-cargo.van.width-cm=240
afterbooth.vehicle-cargo.van.depth-cm=140
afterbooth.vehicle-cargo.van.height-cm=190
afterbooth.vehicle-cargo.truck-1t.width-cm=300
afterbooth.vehicle-cargo.truck-1t.depth-cm=160
afterbooth.vehicle-cargo.truck-1t.height-cm=200
